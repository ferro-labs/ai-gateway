# CI for the nested ferro CLI module (cli/).
#
# This exists as a separate workflow because `go build ./...` and `go test ./...`
# at the repo root do NOT descend into nested modules. Without this file the CLI
# would never be built or tested by CI at all, while the repo reported green.
name: CLI CI

on:
  # The integration job builds ferrogw from the commit under test, so any
  # gateway change can break ferro's contract with it. That is spelled as a
  # DENYLIST on purpose: an allowlist of gateway source roots already missed
  # cmd/** (where ferrogw and its route wiring live) and plugin/** (which backs
  # /admin/plugins/catalog), and it would miss whatever top-level package is
  # added next — silently, by reporting green. Listing what cannot affect the
  # contract is a set that does not grow when the gateway does.
  # The two lists below are duplicated on purpose: GitHub Actions does not
  # reliably expand YAML anchors, and a trigger that silently fails open is
  # the exact defect this block exists to prevent.
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "web/**"
      - "deploy/**"
      - "**/*.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "web/**"
      - "deploy/**"
      - "**/*.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  # Called by cli-release.yml so a tag is gated by this definition rather than
  # by a weaker restatement of it.
  workflow_call:

# Superseding a PR run cancels the one it replaced; a push or a release tag is
# never cancelled, because github.ref differs for each of them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No job here writes to the repository, so none needs more than read. Stated
# at the workflow level, this also replaces the ambient default token scope
# for the jobs cli-release.yml calls this workflow to run.
permissions:
  contents: read

defaults:
  run:
    working-directory: cli

jobs:
  isolation:
    name: HTTP boundary intact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # ferro talks to the gateway over HTTP only. Three layers enforce that;
      # this job owns the one lint cannot see.
      #
      # The primary barrier is that cli/go.mod does not require the gateway
      # module, so gateway packages do not resolve. But `go get` adds that
      # require silently, and if it were ever added, Go's internal/ rule would
      # NOT save us: cli/ sits inside the tree rooted at the repo root, so
      # .../ai-gateway/internal/* would become a legal import. This check fails
      # the build the moment that door is opened; depguard (in .golangci.yml)
      # catches the import itself.
      - name: cli must not depend on the gateway module
        run: |
          if grep -qE 'github\.com/ferro-labs/ai-gateway[^/]' go.mod; then
            echo "::error file=cli/go.mod::cli/go.mod requires the gateway module — the boundary is HTTP only"
            grep -nE 'github\.com/ferro-labs/ai-gateway[^/]' go.mod
            exit 1
          fi
          echo "cli/go.mod does not require the gateway module"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: cli/go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          working-directory: cli
          # Pinned to the version the gateway's own Lint job uses. Left
          # floating, the action resolves "latest" independently of the
          # gateway, so the two modules in this repository lint against
          # different linters -- which is exactly what happened: CI failed on
          # goconst findings that the pinned version does not report, against
          # code that passed locally. Bumping this is a deliberate change, made
          # for both modules together.
          version: v2.11.4

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: cli/go.mod
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/ferro

  integration:
    name: contract vs a gateway built from this commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: cli/go.mod
      # The one thing the fixture cannot prove: that the real server agrees.
      # Builds ferrogw from this same commit and runs the contract suite.
      - run: ./scripts/with-gateway.sh
