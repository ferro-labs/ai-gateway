# Release workflow — triggers when a version tag is pushed (e.g. v0.1.0).
# Builds cross-platform binaries, creates GitHub Release, pushes Docker images
# to ghcr.io using GoReleaser.
#
# To trigger a release:
#   git tag v0.1.0
#   git push origin v0.1.0

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write        # create GitHub releases + upload assets
  packages: write        # push to ghcr.io
  id-token: write        # needed for keyless signing (future)

jobs:
  # Gate the release on the merge gate itself. CI does not run on tag pushes,
  # so without this a broken commit could be tagged and published.
  #
  # It calls the workflow rather than restating its steps, because the two
  # cannot then disagree: the inline gate this replaced had drifted to `go
  # build` + `go vet` + `go test -short -race`, which is silent about lint,
  # formatting, the integration suite, known vulnerabilities and the dashboard
  # bundle that ships inside the binary. Anything CI gains gates releases from
  # the same commit, with no edit here.
  #
  # No secrets are passed: the only step in CI that reads one is the Codecov
  # upload, which is skipped on tag runs.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: GoReleaser
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # GoReleaser needs full history for changelog
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.25.13"
          cache: true

      # The dashboard is embedded in the binary, so GoReleaser's before-hooks
      # build the frontend before any cross-compilation. Without Node on the
      # runner the release fails at that hook rather than at the Go build.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up QEMU (for cross-platform Docker builds)
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify embedded catalog backup
        run: go test ./models -run TestCatalogBackupParseable -count=1

      # cosign signs the checksum file and the Docker images (keyless, via the
      # workflow's OIDC token); syft generates the SBOMs. Both must be on PATH
      # for the GoReleaser signs/sboms stages below.
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Generate release notes
        env:
          # Used by scripts/generate_release_notes.sh to query the GitHub
          # compare API for the per-PR author list (Contributors section).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/generate_release_notes.sh "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/release-notes.md"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          distribution: goreleaser
          # Exact, not "~> v2". The release tool decides what the published
          # artifacts are, so a floating major means two tags cut from the same
          # commit can ship different archives, images and SBOMs.
          #
          # Dependabot does not track this input — it only rewrites `uses:`
          # refs — so bump it by hand. The image config uses `dockers_v2`, whose
          # SBOM attestation this version is the one verified against.
          version: "2.17.1"
          args: release --clean --release-notes="${{ runner.temp }}/release-notes.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The Homebrew tap, the Scoop bucket and the winget fork are all
          # repositories other than this one, and GITHUB_TOKEN is scoped to
          # ferro-labs/ai-gateway alone — it cannot push to any of them.
          #
          # Both variables are exported unconditionally, including before the
          # secrets exist. That is not defensive: an *undefined* variable is not
          # a scoped failure, because Go's template engine aborts config load
          # with `map has no entry for key` before a single binary is built,
          # taking the whole release down with it. An unset secret expands to
          # the empty string, which the templated `skip_upload` in
          # .goreleaser.yaml reads as "this tap does not exist yet" and
          # withholds that surface alone, logging the skip.
          #
          # The winget token is deliberately separate. The other two push to
          # org-owned repositories; this one pushes to a fork that opens pull
          # requests against microsoft/winget-pkgs, which is a different trust
          # grant and should be revocable on its own.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}

  verify-release-assets:
    name: Verify release asset set
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Require every distribution artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')"
          version="${TAG#v}"
          for target in \
            linux_amd64.tar.gz linux_arm64.tar.gz \
            darwin_amd64.tar.gz darwin_arm64.tar.gz \
            windows_amd64.zip windows_arm64.zip; do
            grep -Fxq "ferrogw_${version}_${target}" <<<"$assets" || {
              echo "::error title=Missing release archive::ferrogw_${version}_${target} was not published"
              exit 1
            }
          done
          for extension in deb rpm apk; do
            grep -Fxq "ferrogw_${version}_linux_amd64.${extension}" <<<"$assets" || {
              echo "::error title=Missing Linux package::ferrogw_${version}_linux_amd64.${extension} was not published"
              exit 1
            }
          done

  publish-packages:
    name: Publish npm and PyPI packages
    needs: verify-release-assets
    runs-on: ubuntu-latest
    # A real publish is under ten minutes of work per registry, and the two run
    # concurrently; the rest of the budget is runner queueing and any manual
    # approval on the `pypi` environment. What this bounds is `gh run watch`
    # against a publisher that never finishes -- without it that hangs for the
    # 6-hour default and takes the install verification and the release
    # announcement down with it, since both wait on this job. Raise it if the
    # `pypi` environment ever gains required reviewers who need longer.
    timeout-minutes: 60
    permissions:
      # `gh workflow run` creates a workflow_dispatch run on publish-npm.yml and
      # publish-pypi.yml; that write is the only reason this scope is here. The
      # publishers hold their own credentials -- this job never touches npm or
      # PyPI itself.
      actions: write
      contents: read
    steps:
      - name: Dispatch publishers and wait for completion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          latest_run() {
            gh run list --repo "$REPO" --workflow "$1" --event workflow_dispatch \
              --commit "$COMMIT" --limit 1 --json databaseId \
              --jq '.[0].databaseId // empty'
          }

          dispatch() {
            workflow="$1"
            previous="$(latest_run "$workflow")"
            gh workflow run "$workflow" --repo "$REPO" --ref "$TAG" -f tag="$TAG" >/dev/null
            attempt=0
            while [ "$attempt" -lt 30 ]; do
              current="$(latest_run "$workflow")"
              if [ -n "$current" ] && [ "$current" != "$previous" ]; then
                printf '%s' "$current"
                return
              fi
              attempt=$((attempt + 1))
              sleep 2
            done
            echo "::error title=Publisher run did not start::${workflow} was dispatched but no new run appeared" >&2
            return 1
          }

          npm_run="$(dispatch publish-npm.yml)"
          pypi_run="$(dispatch publish-pypi.yml)"
          status=0
          gh run watch "$npm_run" --repo "$REPO" --exit-status || status=1
          gh run watch "$pypi_run" --repo "$REPO" --exit-status || status=1
          exit "$status"

  verify-installation:
    name: Verify published installation paths
    needs: publish-packages
    uses: ./.github/workflows/install-matrix.yml
    with:
      version: ${{ github.ref_name }}
      require_new_assets: true

  notify-discord:
    name: Discord Release Notification
    runs-on: ubuntu-latest
    needs: verify-installation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/generate_release_notes.sh "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/release-notes.md"

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          NOTES=$(head -c 1800 "${RUNNER_TEMP}/release-notes.md")
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"

          PAYLOAD=$(jq -n \
            --arg title "Ferro Labs AI Gateway ${TAG}" \
            --arg url "$RELEASE_URL" \
            --arg desc "$NOTES" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: 16744448
              }]
            }')

          curl -sf -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK"
