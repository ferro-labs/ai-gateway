# Release workflow — triggers when a version tag is pushed (e.g. v0.1.0).
# Builds cross-platform binaries, creates GitHub Release, pushes Docker images
# to ghcr.io using GoReleaser.
#
# To trigger a release:
#   git tag v0.1.0
#   git push origin v0.1.0

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write        # create GitHub releases + upload assets
  packages: write        # push to ghcr.io
  id-token: write        # needed for keyless signing (future)

jobs:
  # Gate the release on the merge gate itself. CI does not run on tag pushes,
  # so without this a broken commit could be tagged and published.
  #
  # It calls the workflow rather than restating its steps, because the two
  # cannot then disagree: the inline gate this replaced had drifted to `go
  # build` + `go vet` + `go test -short -race`, which is silent about lint,
  # formatting, the integration suite, known vulnerabilities and the dashboard
  # bundle that ships inside the binary. Anything CI gains gates releases from
  # the same commit, with no edit here.
  #
  # No secrets are passed: the only step in CI that reads one is the Codecov
  # upload, which is skipped on tag runs.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: GoReleaser
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # GoReleaser needs full history for changelog
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.25.12"
          cache: true

      # The dashboard is embedded in the binary, so GoReleaser's before-hooks
      # build the frontend before any cross-compilation. Without Node on the
      # runner the release fails at that hook rather than at the Go build.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up QEMU (for cross-platform Docker builds)
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify embedded catalog backup
        run: go test ./models -run TestCatalogBackupParseable -count=1

      # cosign signs the checksum file and the Docker images (keyless, via the
      # workflow's OIDC token); syft generates the SBOMs. Both must be on PATH
      # for the GoReleaser signs/sboms stages below.
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Generate release notes
        env:
          # Used by scripts/generate_release_notes.sh to query the GitHub
          # compare API for the per-PR author list (Contributors section).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/generate_release_notes.sh "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/release-notes.md"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          distribution: goreleaser
          # Exact, not "~> v2". The release tool decides what the published
          # artifacts are, so a floating major means two tags cut from the same
          # commit can ship different archives, images and SBOMs.
          #
          # Dependabot does not track this input — it only rewrites `uses:`
          # refs — so bump it by hand. The image config uses `dockers_v2`, whose
          # SBOM attestation this version is the one verified against.
          version: "2.17.1"
          args: release --clean --release-notes="${{ runner.temp }}/release-notes.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-discord:
    name: Discord Release Notification
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/generate_release_notes.sh "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/release-notes.md"

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          NOTES=$(head -c 1800 "${RUNNER_TEMP}/release-notes.md")
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"

          PAYLOAD=$(jq -n \
            --arg title "Ferro Labs AI Gateway ${TAG}" \
            --arg url "$RELEASE_URL" \
            --arg desc "$NOTES" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: 16744448
              }]
            }')

          curl -sf -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK"
