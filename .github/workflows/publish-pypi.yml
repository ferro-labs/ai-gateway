# Publishes the `ferrogw` platform wheels to PyPI, built from the archives the
# release has already produced. This is what makes `uvx ferrogw` work.
#
# release.yml dispatches this after GoReleaser publishes the release assets and
# waits for it to finish. A PyPI outage can therefore be recovered by rerunning
# this workflow without rebuilding the release.
#
# To republish a release that failed here:
#   gh workflow run publish-pypi.yml -f tag=v1.4.2
#
# See packaging/pypi/README.md for the one-time PyPI trusted-publisher setup.

name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v1.4.2"
        required: true

concurrency:
  group: publish-pypi-${{ inputs.tag }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: Build and publish wheels
    runs-on: ubuntu-latest
    # PyPI scopes the trusted publisher to this environment name as well as to
    # the workflow filename, so the two must match what is registered there.
    environment: pypi
    permissions:
      contents: read   # gh release download
      id-token: write  # PyPI Trusted Publishing — no API token in secrets
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Exact, not floating, for the same reason release.yml pins GoReleaser:
      # this decides what the published artifact *is*. setuptools stamps the
      # wheel's platform tag and owns `setup.py bdist_wheel`, an entry point it
      # has been deprecating for years — a floating version means two tags cut
      # from the same commit can produce differently tagged wheels, or none.
      #
      # Nothing here tracks these automatically; bump them by hand.
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check "setuptools==84.0.0" "packaging==26.3"

      - name: Resolve release tag
        id: release
        env:
          TAG: ${{ inputs.tag }}
        run: echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # The published archives, not the release job's dist/artifacts.json —
      # that directory is long gone by now. These are also the exact bytes
      # users download, so a wheel built from them cannot disagree with the
      # tarball. The SBOMs and cosign material do not match the patterns and
      # are left behind; checksums.txt is fetched separately below.
      - name: Download release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir artifacts \
            --pattern 'ferrogw_*.tar.gz' \
            --pattern 'ferrogw_*.zip'
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir checksums \
            --pattern 'checksums.txt' \
            --pattern 'checksums.txt.pem' \
            --pattern 'checksums.txt.sig'

      # cosign verifies the checksum file itself. sha256sum below then proves
      # each archive matches it -- but on its own that is only an internal
      # consistency check: a release whose archives AND checksums.txt were both
      # replaced passes it. The signature is what ties the file to this
      # repository's release workflow, and the release already produces one, so
      # not checking it here would mean signing artifacts nothing verifies.
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Verify the checksum signature
        working-directory: checksums
        env:
          REPO: ${{ github.repository }}
        run: |
          cosign verify-blob \
            --certificate checksums.txt.pem \
            --signature checksums.txt.sig \
            --certificate-identity-regexp "^https://github\.com/${REPO}/\.github/workflows/.+@refs/tags/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            checksums.txt

      # The same checksum file the shell installer verifies against, and the one
      # cosign signs — so a wheel cannot carry bytes the release did not
      # publish. This is not belt-and-braces over a trusted transport: without
      # it, everything downstream of `gh release download` is taken on faith,
      # and the npm pipeline already verifies, which would have left the two
      # package surfaces built from artifacts with different guarantees.
      #
      # --ignore-missing because checksums.txt also covers the per-archive
      # SBOMs, which are deliberately not downloaded. It still fails on a
      # mismatch for any file that IS present.
      - name: Verify archives against the release checksums
        working-directory: artifacts
        run: sha256sum --ignore-missing -c ../checksums/checksums.txt

      # --tag is a cross-check, not an input: the version the wheels carry comes
      # from the archive filenames, and this fails the run if the two disagree.
      - name: Build wheels
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          python packaging/pypi/build_wheels.py \
            --archive-dir artifacts \
            --dist-dir wheelhouse \
            --tag "$TAG"

      # Nothing above this point has run the packaged binary: build_wheels.py
      # reads each wheel from the outside and never execs what is inside it, so
      # a wheel whose script is present, correctly tagged and unusable -- a
      # binary truncated in transit, or one carrying another architecture --
      # passes every check and fails on the first user's machine instead.
      # publish-npm.yml execs the packed shim for exactly this reason, and
      # packaging/pypi/README.md documents this as the local procedure.
      #
      # manylinux x86_64 alone, because one runner installs one platform tag and
      # cannot exec the rest. That is enough to catch the failure this layout
      # can have: an installed `ferrogw` that is not a runnable program.
      #
      # The wheel is globbed rather than named from the tag. Its version is the
      # PEP 440 spelling (`v1.5.0-rc.1` becomes `1.5.0rc1`) while the binary
      # reports GoReleaser's, so the two strings differ on every prerelease and
      # a constructed filename would miss the wheel exactly when a prerelease is
      # being published. The tag is still what the binary is held to, below.
      - name: Smoke test the manylinux wheel
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -eu
          wheel=(wheelhouse/ferrogw-*-py3-none-manylinux2014_x86_64.whl)
          python -m venv "${RUNNER_TEMP}/wheelcheck"
          # --no-index, or this stops being a test of these bytes: pip would
          # otherwise be free to reach PyPI, satisfy `ferrogw` from the last
          # good published release, and pass while proving nothing about the
          # wheel this run built.
          "${RUNNER_TEMP}/wheelcheck/bin/pip" install \
            --disable-pip-version-check --no-index "${wheel[0]}"
          raw="$("${RUNNER_TEMP}/wheelcheck/bin/ferrogw" version)"
          # Parse the Version field rather than grepping the whole output: the
          # report also carries a commit and a build date, so a substring match
          # can pass on a coincidence and would accept a binary reporting some
          # other version entirely. Same assertion publish-npm.yml makes.
          got="$(printf '%s\n' "$raw" | awk '$1 == "Version" { print $2; exit }')"
          if [ "$got" != "${TAG#v}" ]; then
            echo "::error title=Installed wheel reports the wrong version::expected '${TAG#v}', got '${got:-<no Version line in output>}'"
            printf 'full output:\n%s\n' "$raw"
            exit 1
          fi

      # Uploads over OIDC against the trusted publisher, and attaches PEP 740
      # attestations by default — the registry-side equivalent of the keyless
      # cosign signatures the release already carries.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: wheelhouse
          # PyPI files are immutable, so a run that uploaded four of seven
          # wheels and then hit a transient error cannot be recovered by the
          # rerun this workflow documents as its recovery path: the retry meets
          # the already-published files and fails before reaching the rest,
          # leaving the version permanently incomplete. Skipping what is already
          # there lets the retry finish the release.
          #
          # It does not weaken the build: the wheels are rebuilt from the same
          # release archives, which were checksum- and cosign-verified above, so
          # a skipped file is one this run would have produced identically.
          skip-existing: true
