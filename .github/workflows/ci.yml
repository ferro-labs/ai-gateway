# CI workflow — build, test (with race detector), lint.
# Pushes run only on main; every other branch is covered once via its pull
# request, so a push to a branch with an open PR does not run CI twice.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "release/**"]
    paths-ignore:
      - "docs/**"
  # Called by release.yml, so a tag is gated by this definition rather than by
  # a weaker restatement of it. Every job below therefore gates releases too,
  # and a job added here needs no corresponding edit there.
  workflow_call:
  # A vulnerability is disclosed against a dependency, not against a commit, so
  # the vulnerability job below has to run on a clock as well as on a diff:
  # without this, a repository nobody pushed to all month reports green while
  # the advisory that affects it has been public for weeks.
  #
  # Actions has no per-job schedule, so this runs the whole workflow — which is
  # the cheaper answer anyway. Restricting it to one job means an `if:` on every
  # other job, i.e. a second, hand-maintained definition of what runs when, in
  # the workflow whose entire point is that one definition exists. A full run
  # also catches the rot a scan cannot see: a floating dependency, a changed
  # toolchain, a base action that moved under a tag.
  #
  # Scheduled runs use the default branch. 04:00 Monday sits between
  # code-scanning (03:00) and catalog-backup (06:00) rather than on top of them.
  schedule:
    - cron: "0 4 * * 1"

# Cancel superseded in-progress runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.25.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Test (race + short)
        # Per-package binary timeout. The gateway package's -race suite runs
        # ~160s and 180s left too little headroom, killing legitimate runs on
        # slower/loaded runners. 300s is a safe margin; the suite's size is
        # tracked as test-hygiene follow-up.
        run: go test -v -short -race -timeout 300s ./...

      - name: Test coverage
        if: matrix.go == '1.25.12'
        id: coverage
        run: |
          go test -short -race -coverprofile=coverage.out -covermode=atomic ./...
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "Total coverage: $total"
          {
            echo "## Go Coverage"
            echo ""
            echo "Go version: \`${{ matrix.go }}\`"
            echo "Total coverage: \`$total\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: matrix.go == '1.25.12'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage-go-${{ matrix.go }}
          path: coverage.out
          if-no-files-found: error

      # Not run on tag pushes (this workflow called from release.yml): the tag
      # points at a commit main already measured, so the upload is duplicate
      # telemetry — and it is the one step here that is not a gate, yet
      # fail_ci_if_error would let a Codecov outage block a release. Keeping it
      # off the tag path is also why the reusable call passes no secrets.
      - name: Upload coverage to Codecov
        if: matrix.go == '1.25.12' && github.ref_type != 'tag'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: unittests
          name: ai-gateway-go-${{ matrix.go }}
          fail_ci_if_error: true

  web:
    name: Web application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix web

      - name: Check application
        run: npm run check --prefix web

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.25.12"
          check-latest: true
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run integration tests
        run: make test-integration

  vulnerability:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.25.12"
          check-latest: true
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
      with:
        go-version: '1.25.12'
        check-latest: true

    - name: Run golangci-lint (v2)
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
      with:
        version: v2.11.4
        args: --verbose

    # Build-tagged sources are invisible to the run above — tags have to be
    # named, and the untagged analysis simply skips those files. That is the
    # same hole the formatter step below documents, and it had let a similar
    # amount of drift accumulate before anyone measured it.
    #
    # The scope is written out rather than `./...` because a repo-wide tagged
    # analysis does not build: test/testutil is itself integration-tagged and
    # imports the root package, so tagging everything produces an import cycle
    # in test. `make lint` runs the identical scope and fails if a tagged file
    # appears outside it, so the two cannot drift apart.
    - name: Run golangci-lint (build-tagged sources)
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
      with:
        version: v2.11.4
        args: --verbose --build-tags=integration,live ./mcp/... ./test/...

    # Separate from golangci-lint rather than folded into it: that run enables
    # no formatter, and it skips every build-tagged file unless build-tags are
    # configured, which is where formatting had actually drifted. This checks
    # the same file set `make fmt` rewrites, so the two cannot disagree.
    - name: Check formatting
      run: make fmt-check
