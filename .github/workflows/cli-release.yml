# Release for the ferro CLI.
#
# Triggers ONLY on cli/v* tags. The gateway's release.yml triggers on v*, which
# never matches a cli/-prefixed tag, so the two release trains cannot collide:
#   gateway:  git tag v1.5.0      -> release.yml     -> ferrogw
#   cli:      git tag cli/v0.1.0  -> this workflow   -> ferro
name: CLI Release

on:
  push:
    tags: ["cli/v*"]

# No ambient permission. Each job takes only what it needs, so the reusable
# CI workflow cannot write to the repository just because the release job must.
permissions: {}

jobs:
  # A tag is gated by the same definition PRs are, rather than by a weaker
  # restatement of it.
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/cli-ci.yml

  goreleaser:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the release and uploads its archives
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # goreleaser needs full history to build the changelog
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: cli/go.mod

      # GoReleaser OSS expects a bare semver tag. Give its local packaging step
      # v0.1.0 so binaries and archives carry 0.1.0, but skip GoReleaser's
      # publisher: publishing that synthetic tag would collide with the
      # gateway release train. The following step publishes the packages to
      # the real cli/v0.1.0 tag explicitly.
      #
      # Read via env, not ${{ }} interpolation: a tag name is attacker-
      # influenced text and must never be spliced into a shell line.
      - name: Derive ferro version from the cli/-prefixed tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#cli/}"
          # Match the whole string: "v[0-9]*" accepts cli/v1invalid, which
          # would produce an archive named after a version that is not one.
          if ! printf '%s' "$version" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag $TAG_NAME does not yield a semver version (got '$version')"
            exit 1
          fi
          echo "GORELEASER_CURRENT_TAG=$version" >> "$GITHUB_ENV"
          echo "releasing ferro $version from tag $TAG_NAME"

      - uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          args: release --clean --skip=publish,announce,validate -f cli/.goreleaser.yaml

      - name: Publish packages to the namespaced CLI release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#cli/v}"
          previous="$(git describe --tags --match 'cli/v*' --abbrev=0 "$TAG_NAME^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            git log --format='- %s (%h)' "$previous..$TAG_NAME" -- cli > /tmp/ferro-release-notes.md
          else
            git log --format='- %s (%h)' "$TAG_NAME" -- cli > /tmp/ferro-release-notes.md
          fi
          if [ ! -s /tmp/ferro-release-notes.md ]; then
            printf '%s\n' 'Initial Ferro CLI release.' > /tmp/ferro-release-notes.md
          fi

          gh release create "$TAG_NAME" \
            cli/dist/ferro_"$version"_*.tar.gz \
            cli/dist/ferro_"$version"_*.zip \
            cli/dist/checksums.txt \
            --title "Ferro CLI v$version" \
            --notes-file /tmp/ferro-release-notes.md
