# Ferro Labs AI Gateway Configuration Example
# Copy to config.yaml and customize.

# Config schema version. Advisory only: it is never a load failure, and a value
# this build does not recognize is kept and warned about so a newer file still
# starts on an older binary. Omitted means v1.
apiVersion: v1

# Maximum request body size in bytes for data-plane (/v1/*) and admin write
# endpoints. Requests exceeding this limit receive HTTP 413.
# Default: 10485760 (10 MiB). Set to a lower value to harden against large
# POST attacks; set higher only if you need to send very large prompts.
# max_request_bytes: 10485760

# Bounds a single non-streaming request end to end — plugin stages, the provider
# call, and every retry and fallback attempt combined. Omitted means no
# gateway-imposed deadline (the provider HTTP clients' own timeouts still apply).
# Streaming requests are exempt: a stream legitimately outlives a fixed deadline.
# (With MCP tool servers configured, a "stream" runs the agentic loop to completion
# and arrives as one chunk — that is not really a stream, and the deadline applies.)
# request_timeout: 60s

strategy:
  mode: fallback  # single | fallback | loadbalance | conditional | content-based | ab-test | least-latency | cost-optimized
  # Pool modes (fallback, loadbalance, least-latency, cost-optimized, ab-test)
  # advance after transport failures, attempt timeouts, 408, 429, 5xx, open
  # circuits, target saturation, or a provider's own context-length overflow
  # error (recognised envelopes only). The request's own cancellation or
  # deadline and every other 4xx stop there.
  # single stops after its one target. A conditional or content-based rule walks
  # its target_keys chain on the same classes and stops at its end; a rule with
  # one target therefore stops after that target.
  #
  # Under EVERY mode a target whose circuit breaker is open is passed over when
  # the choice is made, so a dead backend stops taking traffic while a healthy
  # one is configured. When every candidate's circuit is open the request is
  # still attempted and answered 503 — "everything that serves this model is
  # down" is a different answer from "nothing serves this model".
  #
  # Extra upstream statuses to treat as failover-safe, for an upstream whose
  # "try elsewhere" answer is not one of the built-in classes. HTTP statuses
  # only; the caller's own cancellation or deadline always stops routing, and
  # 400, 401, 403, 404 and 422 cannot be listed — a different target cannot
  # fix a malformed or unauthorised request.
  # failover_on_status_codes: [409]
  #
  # For loadbalance and ab-test only: pin a request to the same target for the
  # same `user` field, so a conversation keeps its provider prompt cache and an
  # A/B session keeps its variant. A stateless hash — no shared state, and the
  # same answer on every replica with this config. A request with no `user`
  # draws at random. `ttl` rotates pins: none outlives one window.
  # sticky: { on: user, ttl: 1h }
  #
  # For cost-optimized mode only: fallback (default) | skip | allow.
  # fallback prefers priced candidates, then first compatible unpriced target.
  # skip rejects unpriced candidates; allow treats missing prices as zero cost.
  # unpriced_strategy: fallback

# --- conditional routing example ---
# strategy:
#   mode: conditional
#   conditions:
#     - key: model
#       value: gpt-4o
#       target_key: openai
#     - key: model
#       value: claude-sonnet-4-6
#       target_key: anthropic
#     - key: model_prefix
#       value: gemini
#       target_keys: [gemini, vertex-ai]   # an ordered chain: gemini, then vertex-ai
#     - key: metadata               # one entry of the X-Gateway-Metadata request
#       field: tier                 # header, a small JSON object of scalar values
#       value: gold
#       target_key: openai
# Routes based on the value of a request field. Keys: model, model_prefix, user
# (the request's `user`), stream and has_tools ("true"/"false"), and metadata
# (`field` names the entry). No other request header reaches a rule.
# A rule names its targets, and no other: `target_key` names one, `target_keys`
# an ordered chain. The walk tries the chain in order, advancing only on a
# failover-safe failure (see the pool modes above) and skipping a member whose
# circuit is open or that is parked after a 429 — and never substitutes a
# target outside the chain. A rule with one target is therefore exact: a request
# for a model it does not serve, or a target whose circuit is open, is answered
# with the corresponding error even when another configured target could
# serve it. Give such a model its own rule, or a chain. `/v1/models` lists only
# what the active mode would actually route, so a model missing from it is the
# signal that a rule is needed.

# --- content-based routing example ---
# strategy:
#   mode: content-based
#   content_conditions:
#     - type: prompt_regex
#       value: "(?i)\\b(code|function|class|implement)\\b"
#       target_key: deepseek
#     - type: prompt_contains
#       value: "translate"
#       target_key: gemini
#     - type: prompt_not_contains
#       value: "confidential"
#       target_key: openai
# First matching rule wins; falls back to the first target when no rule matches.
# As with conditional routing, a rule may name a chain (`target_keys`), and the
# matched chain is asked and no other.

# --- A/B testing example ---
# strategy:
#   mode: ab-test
#   ab_variants:
#     - target_key: openai
#       weight: 70
#       label: control
#     - target_key: anthropic
#       weight: 30
#       label: challenger
# Weights are relative: a variant's share is its weight over the total.
# Zero means zero. A zero-weight variant receives no traffic at all, which is
# how you drain one before removing it — so at least one weight must be
# positive. An all-zero set and a negative weight are both config errors,
# rejected by `ferrogw validate` and at startup rather than at request time.

targets:
  - virtual_key: openai
    # Relative share under mode: loadbalance; ignored by every other mode.
    # Zero means zero — a zero-weight target receives none of the load, which is
    # how you drain one ahead of revoking its credential. At least one target's
    # weight must therefore be positive; an all-zero set and a negative weight
    # are both rejected at load.
    weight: 1.0
    # Bound on ONE attempt against this target, inside request_timeout (which
    # stays authoritative for the whole request). A unary attempt is bounded
    # through its response; a streaming attempt only until the provider
    # answers, because a stream that has begun cannot be replayed elsewhere. An
    # attempt that times out is failover-safe: pool modes move on to the next
    # target, so a hung primary no longer consumes the whole request budget.
    # timeout: 8s
    # Retry is per target and applies under EVERY routing mode. Retry is how
    # many times ONE target is asked; pool modes may then advance as described
    # above, while named modes stop.
    retry:
      attempts: 3
      # Only retry on these HTTP status codes. Omit to use the default policy:
      # transport errors plus 408, 429 and 5xx. Other 4xx are deterministic client
      # errors and are never retried.
      on_status_codes: [429, 502, 503]
      # Base backoff in ms for exponential back-off with full jitter: the wait is
      # picked uniformly from [0, initial_backoff_ms * 2^(attempt-1)). An upstream
      # Retry-After header, when present, takes precedence over the computed backoff.
      initial_backoff_ms: 100
    # Optional per-target concurrency limit. Providers often cap simultaneous
    # connections independently of any RPM/TPM quota; without a gate the gateway can
    # saturate one and collect 429s it then has to serve to its own callers.
    concurrency:
      max_concurrency: 32   # simultaneous in-flight requests to this target
      queue_size: 500       # requests allowed to wait for a slot; beyond it => HTTP 429
      # A streaming request holds its slot until the stream ends, not just until
      # response headers arrive.
  - virtual_key: anthropic
    weight: 1.0
    # Optional visible-model to upstream-model translation. Keys participate in
    # routing and /v1/models; pricing uses the mapped upstream model.
    # model_map: { smart: claude-sonnet-4-6 }
    # Optional per-target circuit breaker.
    #
    # BLAST RADIUS: one breaker per TARGET, not per endpoint. Chat, streaming,
    # embeddings and image generation to this target all count into it and are all
    # refused by it — so an upstream that fails only /v1/embeddings (a redirect to a
    # moved path, a decommissioned route) opens the shared circuit and stops serving
    # CHAT too, having never failed a chat request. Traffic then moves to another
    # target that serves the model under every routing mode, or gets a 503 when
    # none does. There are no per-surface breakers: a surface expected to be
    # unavailable belongs on its own target.
    #
    # A 429, a client disconnect, a caller-supplied deadline, an
    # unsupported-parameter rejection and a concurrency shed do NOT count toward
    # opening it. A redirect, a 5xx, a connection failure, and this gateway's own
    # request_timeout or stream idle bound elapsing all do.
    circuit_breaker:
      failure_threshold: 5   # consecutive failures before opening
      success_threshold: 1   # successes in half-open state to close
      max_half_threshold: 1  # concurrent probes allowed while half-open
      timeout: 30s           # duration the circuit stays open
  - virtual_key: xai
  - virtual_key: gemini
    # Models this target serves, declared by you, IN ADDITION to whatever the
    # model catalog and live discovery already report for it. Reach for it when a
    # target serves a model no automatic source knows: an id newer than the
    # catalog, a preview or regional name, a self-hosted deployment behind
    # <PROVIDER>_BASE_URL, or a provider that exposes no /models endpoint to
    # enumerate. Every target has the field, so no gap waits on provider work.
    #
    # It only ever adds. Declaring one model does not hide the rest, and
    # declaring one the catalog already reports is a harmless no-op. Declared
    # models are routable and appear in /v1/models.
    #
    # Entries are exact model ids. Wildcards are rejected at load: the routing
    # index is an exact-match map, so a pattern would match nothing while
    # looking like it matched everything.
    models:
      - gemini-2.5-flash
  - virtual_key: mistral
  - virtual_key: groq
  - virtual_key: together
  - virtual_key: cohere
  - virtual_key: deepseek
  - virtual_key: perplexity
  - virtual_key: fireworks
  - virtual_key: ai21
  - virtual_key: replicate
  - virtual_key: bedrock
  - virtual_key: azure-openai
  - virtual_key: azure-foundry
  - virtual_key: vertex-ai
  - virtual_key: hugging-face
  - virtual_key: ollama
  - virtual_key: ollama-cloud
  - virtual_key: cerebras
  - virtual_key: cloudflare
  - virtual_key: databricks
  - virtual_key: deepinfra
  - virtual_key: moonshot
  - virtual_key: novita
  - virtual_key: nvidia-nim
  - virtual_key: openrouter
  - virtual_key: qwen
  - virtual_key: sambanova

# Batch + files backend. The /v1/files* and /v1/batches* endpoints carry no
# model and reference opaque, provider-scoped ids, so a single target serves them
# all — native ids are preserved and every follow-up call (retrieve, cancel,
# download) resolves against the same backend with no gateway state. Omit to turn
# the surface off (those endpoints then return 501). The named target's provider
# must support batch pass-through: openai, azure-openai, groq, novita, qwen.
# batch_target: openai

# Responses id sub-routes backend. POST /v1/responses routes by model and is
# governed + priced automatically; the stateful id sub-routes
# (GET/DELETE /v1/responses/{id}, /cancel, /input_items) carry no model and pin
# to this one target. Omit to leave those sub-routes off (501) — create still works.
# responses_target: openai

# Model aliases: map friendly names to actual model IDs.
# Aliases are resolved before routing and plugin execution.
aliases:
  fast: gpt-4o-mini
  smart: claude-sonnet-4-6
  cheap: gemini-2.5-flash
  code: deepseek-coder

# Optional plugins
# Plugin config string values support ${VAR} references — only the braced form;
# a bare $ is literal data. Resolved when the plugin is constructed, not at load.
#
# `type` is a label: it is returned by GET /admin/plugins and is not what the
# gateway acts on. Each plugin reports its own type, and that is what decides
# whether a plugin failure fails open (logging, metrics) or closed (everything
# else). `stage`, `enabled` and `config` are what change behaviour here.
#
# Order within a stage is the order written here. It is no longer a safety
# property: a plugin can decline the provider call but never the rest of the
# chain, so a response-cache hit runs every guardrail behind it. Guardrails
# still belong ahead of response-cache for three other reasons:
#   • response-cache keys on a hash of the request, so a transform that
#     rewrites the request has to run first — behind the cache it would key on
#     a request that is not the one the provider is sent.
#   • a request that policy is going to deny has no business reading from or
#     writing to the cache at all.
#   • a denial ends the before_request stage, so putting the cheapest check
#     first is the least work done before the request is refused.
plugins:
  - name: word-filter
    type: guardrail
    stage: before_request
    enabled: true
    config:
      blocked_words: ["password", "secret"]
      case_sensitive: false

  - name: max-token
    type: guardrail
    stage: before_request
    enabled: true
    config:
      max_tokens: 4096
      max_messages: 50
      # Optional: reject if total character length of all messages exceeds this. 0 = no limit.
      max_input_length: 0

  # Listed at both stages because the plugin implements both: the before_request
  # branch serves a cache hit and skips the provider call — the provider call
  # only, every other plugin still runs — and the after_request branch stores
  # the response. One entry registers one stage, and both entries must carry
  # IDENTICAL config: config equality is what resolves them to one instance
  # sharing one cache, and the gateway refuses to start when they disagree.
  - name: response-cache
    type: transform
    stage: before_request
    enabled: false
    config:
      max_age: 300
      max_entries: 1000
  - name: response-cache
    type: transform
    stage: after_request
    enabled: false
    config:
      max_age: 300
      max_entries: 1000

  # Listed at all three stages because the plugin implements all three: the
  # before_request branch records the inbound request, after_request records a
  # completion with its latency, time-to-first-token and cost, and on_error
  # records a failure with its reason. One entry registers one stage, and all
  # entries must carry identical config — a plugin listed at several stages is
  # one plugin, and the gateway refuses to start if they disagree.
  #
  # The on_error entry is not optional bookkeeping. A failed request never
  # reaches after_request, so without it a failure produces no terminal row at
  # all and disappears from the default `GET /admin/logs` listing and from the
  # dashboard — exactly the requests an operator is looking for.
  - name: request-logger
    type: logging
    stage: before_request
    enabled: true
    config:
      level: info
      # Persist each request to the shared request-log store when one is
      # configured; otherwise logs are emitted only to stdout. The store's
      # location is process configuration, set with the REQUEST_LOG_STORE_BACKEND
      # and REQUEST_LOG_STORE_DSN environment variables — not here.
      persist: false
  - name: request-logger
    type: logging
    stage: after_request
    enabled: true
    config:
      level: info
      persist: false
  - name: request-logger
    type: logging
    stage: on_error
    enabled: true
    config:
      level: info
      persist: false

  # Advanced guardrails (pii-redact, secret-scan, prompt-shield, schema-guard,
  # regex-guard) are available in FerroCloud. See https://docs.ferrolabs.ai/guardrails

  - name: rate-limit
    type: guardrail
    stage: before_request
    enabled: false
    config:
      # Every rate below must be > 0; 0 and negative values are rejected at
      # load, by `ferrogw validate` and at startup alike. There is no "off"
      # value here — a rate of zero rejects every request forever. Turn this
      # plugin off with `enabled: false` instead. The unrelated per-IP limiter
      # configured by RATE_LIMIT_RPS reads 0 the other way round: there it is
      # the whole switch and means "no limiting".
      #
      # Global request-per-second limit applied to all traffic.
      requests_per_second: 100
      # Global burst capacity (defaults to requests_per_second when unset).
      burst: 100
      # Optional per-API-key limit (requests per minute).
      key_rpm: 60
      # Optional per-user limit (requests per minute, keyed on Request.User).
      user_rpm: 30

  # Listed at both stages because the plugin implements both: the before_request
  # branch checks the key's accumulated spend against the limit, the after_request
  # branch records what the completed request cost. One entry registers one stage,
  # and both entries must carry IDENTICAL config — the same store_id is not
  # enough on its own. Config equality is what resolves them to one instance
  # sharing one set of spend counters, and the gateway refuses to start when
  # they disagree.
  - name: budget
    type: guardrail
    stage: before_request
    enabled: false
    config:
      # Shared store identifier — all plugin instances with the same store_id
      # share the same spend counters. Defaults to "default".
      store_id: default
      # Maximum cumulative USD spend allowed per API key. 0 = unlimited.
      spend_limit_usd: 10.0
      # Pricing used to calculate cost from token counts in the response.
      input_per_m_tokens: 3.0    # USD per 1 million prompt tokens
      output_per_m_tokens: 15.0  # USD per 1 million completion tokens
      # Maximum number of API keys tracked in memory. Evicts lowest-spend key at cap.
      max_keys: 10000
  - name: budget
    type: guardrail
    stage: after_request
    enabled: false
    config:
      store_id: default
      spend_limit_usd: 10.0
      input_per_m_tokens: 3.0
      output_per_m_tokens: 15.0
      max_keys: 10000

# MCP (Model Context Protocol) agentic tool servers.
# When configured, the gateway injects these tools into every chat completion
# request and runs an agentic loop when the LLM returns tool_calls.
#
# Two transports are supported:
#   • Streamable HTTP (MCP 2025-11-25) — set url; command must be omitted.
#   • stdio                            — set command; url must be omitted.
mcp_servers:
  # ── HTTP transport examples ──────────────────────────────────────────────────

  # Local filesystem tool server (no auth required).
  - name: filesystem
    url: "http://localhost:3001/mcp"
    timeout_seconds: 10
    max_call_depth: 3

  # Database tool server restricted to read-only tools.
  - name: database
    url: "https://mcp-db.internal/mcp"
    headers:
      # ${VAR} is resolved when the MCP client is constructed, so the config
      # keeps the reference and never stores the secret. Only the braced form is
      # a reference; a bare $ is literal data, and an undefined variable errors.
      Authorization: "Bearer ${MCP_DB_TOKEN}"
    allowed_tools:
      - query_readonly
      - list_tables
    timeout_seconds: 15
    max_call_depth: 5
    # Opt in to gating readiness on this server. Default false: an unready
    # server is reported in the /readyz body but does not fail the probe.
    # Set true only where the deployment cannot serve without these tools —
    # a required server that is down 503s /readyz and takes the instance out
    # of rotation, stopping all traffic including requests that use no tools.
    #
    # Unready means the initialize handshake has not completed. An HTTP server
    # that answered the handshake and later became unreachable keeps reporting
    # ready and its calls fail per request; only a stdio server's death is
    # detected after the fact. So `required: true` here does not take the
    # instance out of rotation when this server goes down mid-run.
    required: false

  # Web-search tool server.
  - name: web-search
    url: "https://mcp-search.example.com/mcp"
    allowed_tools:
      - web_search
      - web_read
    timeout_seconds: 20

  # ── stdio transport examples ─────────────────────────────────────────────────
  # The gateway launches the subprocess and communicates via stdin/stdout.
  # The process runs for the lifetime of the gateway.
  #
  # The subprocess does NOT inherit the gateway's environment. It receives
  # PATH, HOME, LANG and TMPDIR (when set) plus exactly the keys under `env`,
  # so gateway credentials such as OPENAI_API_KEY and MASTER_KEY can never
  # reach an MCP server. Anything else the server needs — HTTPS_PROXY,
  # NODE_PATH, SSL_CERT_FILE, or SYSTEMROOT/APPDATA on Windows — must be
  # listed explicitly.

  # npx-based MCP server (no pre-installation required).
  - name: brave-search
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-brave-search"
    env:
      # Resolved when the MCP client is constructed; the config keeps the
      # reference. This is the only channel for a credential, since the
      # gateway environment is not inherited.
      BRAVE_API_KEY: "${BRAVE_API_KEY}"
    max_call_depth: 3

  # Python-based MCP server installed in a virtualenv.
  - name: sqlite-db
    command: /path/to/venv/bin/python
    args:
      - -m
      - mcp_server_sqlite
      - --db-path
      - /var/data/app.db
    allowed_tools:
      - query
      - list_tables
    max_call_depth: 5

# Compatibility controls how the gateway treats OpenAI request parameters that a
# routed provider cannot express (see GET /v1/capabilities for the matrix).
#   warn   — forward the parameter and log a warning (default)
#   drop   — remove the parameter from the upstream request and log
#   reject — fail the request with HTTP 400 naming the parameter
#
# warn and drop differ only for providers reached over an OpenAI-compatible
# request body, where warn genuinely does forward the parameter. A provider
# with a native wire format — anthropic, bedrock, gemini, cohere, ai21,
# replicate — builds a payload with nowhere to put it, so there warn and drop
# send byte-identical upstream requests and both log "dropping". Use reject
# when a parameter actually being honoured matters.
# compatibility:
#   on_unsupported_param: warn

# OpenTelemetry tracing (v1.1.0+).
# When unset (or endpoint empty) the gateway runs with a zero-alloc
# NoOp provider — there is no cost to leaving this section out.
# OTEL_EXPORTER_OTLP_ENDPOINT and OTEL_EXPORTER_OTLP_TRACES_ENDPOINT both take
# precedence over the endpoint set here; when either is set its value is handed
# to the OTel SDK unread, so the specification's own path rules apply to it.
# Setting either one turns tracing on. They are the only OTEL_* variables
# the gateway itself reads: sampling comes from sample_ratio below, not from
# OTEL_TRACES_SAMPLER.
observability:
  tracing:
    enabled: true
    # A URL (http://host:4318, https://collector.example.com) or a bare
    # host:port, which means plaintext. This is a BASE endpoint: under
    # protocol: http/protobuf the traces path v1/traces is appended to it.
    # Pasting the full signal URL a collector's docs print also works — a value
    # already ending in v1/traces is used as written rather than having the path
    # appended twice. A value that cannot be understood at all is rejected at
    # startup rather than silently exporting nothing. Leave blank to fall back
    # to the OTEL_EXPORTER_OTLP_* environment, whose values are handed to the
    # SDK unread and therefore follow the specification exactly: the base
    # variable gets v1/traces appended, the signal-specific one does not.
    endpoint: ""
    protocol: grpc           # grpc | http/protobuf
    service_name: ferrogw
    # Head sampler ratio, wrapped in ParentBased: a request arriving with an
    # already-sampled traceparent is followed regardless of this value, so a
    # ratio below 1.0 never breaks a distributed trace in half.
    sample_ratio: 1.0
    privacy_level: metadata  # none | metadata | full
    shutdown_grace: 10s      # per OTel shutdown stage; total can take up to 2x this value
    # headers:                       # OTLP export headers (e.g. vendor API keys)
    #   dd-api-key: "${DATADOG_API_KEY}"   # values support ${ENV_VAR} references

  # exporters lists plugin observability exporters that receive
  # gateway.request.completed / gateway.request.failed events.
  # Config string values support ${VAR} references — only the braced form;
  # resolved when the exporter is constructed, not at config load.
  # Each entry names a factory registered via observability.RegisterExporter
  # in a plugin's init().  Unrecognised names emit a warning and are skipped
  # (non-fatal).  No built-in exporters ship with this repo — they are
  # provided by the ai-gateway-plugins repo.
  #
  # exporters:
  #   - name: langsmith
  #     enabled: true
  #     config:
  #       api_key: "${LANGSMITH_API_KEY}"
  #   - name: langfuse
  #     enabled: true
  #     config:
  #       public_key: "${LANGFUSE_PUBLIC_KEY}"
  #       secret_key: "${LANGFUSE_SECRET_KEY}"
