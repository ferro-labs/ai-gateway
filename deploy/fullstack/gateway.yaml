plugins:
  # Trips on a prompt containing one of these words, so the request-log and error
  # panels include guardrail rejections alongside upstream errors.
  - name: word-filter
    type: guardrail
    stage: before_request
    enabled: true
    config:
      blocked_words: ['forbidden-word']
      case_sensitive: false

  - name: max-token
    type: guardrail
    stage: before_request
    enabled: true
    config:
      max_tokens: 8192
      max_messages: 50

  # A modest global rate so a burst from the load generator produces
  # gateway_rate_limit_rejections_total for the rate-limit panel.
  - name: rate-limit
    type: guardrail
    stage: before_request
    enabled: true
    config:
      requests_per_second: 80
      burst: 80

  # persist: true writes rows the dashboard's Request Logs page reads. Listed at
  # all three stages so a failed request still produces a terminal row.
  - name: request-logger
    type: logging
    stage: before_request
    enabled: true
    config:
      level: info
      persist: true
  - name: request-logger
    type: logging
    stage: after_request
    enabled: true
    config:
      level: info
      persist: true
  - name: request-logger
    type: logging
    stage: on_error
    enabled: true
    config:
      level: info
      persist: true

observability:
  tracing:
    enabled: true
    endpoint: jaeger:4317
    protocol: grpc
    service_name: ferrogw
    sample_ratio: 1.0
    privacy_level: metadata
