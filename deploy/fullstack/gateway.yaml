# Gateway configuration for the fullstack observability demo.
#
# MOCK MODE: every target below is an OpenAI-compatible provider pointed at the
# in-compose mock upstream via its <PROVIDER>_BASE_URL (set in
# compose.fullstack.yaml). Load-balancing across all of them fills the
# per-provider dashboard panels with data — with no real provider key and
# nothing billed. To go live, see the "MOCK MODE" block in compose.fullstack.yaml.
#
# Only OpenAI-wire providers are listed: anthropic, gemini, bedrock, cohere,
# ai21 and replicate use native request/response formats an OpenAI-shaped mock
# cannot serve, so they are intentionally omitted here.

strategy:
  mode: loadbalance

targets:

  - virtual_key: openai
    weight: 1
    models:
      - gpt-4o-mini
      - gpt-4o
      - gpt-3.5-turbo
      - text-embedding-3-small
    retry:
      attempts: 2
      initial_backoff_ms: 100
    circuit_breaker:
      failure_threshold: 5
      timeout: 10s
