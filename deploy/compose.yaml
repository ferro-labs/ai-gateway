# Base configuration shared by dev and prod. Never used alone — it names an
# image and no override, so it has neither a build nor a restart policy.
#
# Use with an override file, from the repository root:
#   Dev:  make up        (docker compose -f deploy/compose.yaml -f deploy/compose.dev.yaml up)
#   Prod: make up-prod   (docker compose -f deploy/compose.yaml -f deploy/compose.prod.yaml up -d)
#
# One service. The dashboard is compiled into the gateway binary and served
# from the port below, so there is no second container to bring up.

# Compose derives the project name from the directory holding the first -f
# file, which moving these files changed from "ai-gateway" to "deploy" — a name
# generic enough to collide with an unrelated checkout, and one that would have
# orphaned the containers, volumes and networks an existing stack already owns.
# Pinned to the previous value so an upgrade adopts that stack rather than
# starting a second one beside it.
name: ai-gateway

services:
  ferrogw:
    image: ghcr.io/ferro-labs/ai-gateway:latest
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      # Provider API keys (set at least one):
      # - OPENAI_API_KEY=sk-...
      # - ANTHROPIC_API_KEY=sk-...
      # - GEMINI_API_KEY=...
      # - MISTRAL_API_KEY=...
      # - GROQ_API_KEY=gsk_...
      # - TOGETHER_API_KEY=...
      # - COHERE_API_KEY=...
      # - DEEPSEEK_API_KEY=...
      # - PERPLEXITY_API_KEY=...
      # - FIREWORKS_API_KEY=...
      # - AI21_API_KEY=...
      # - XAI_API_KEY=...
      # - CEREBRAS_API_KEY=...
      # - DEEPINFRA_API_KEY=...
      # - MOONSHOT_API_KEY=...
      # - NOVITA_API_KEY=...
      # - NVIDIA_NIM_API_KEY=...
      # - OPENROUTER_API_KEY=...
      # - QWEN_API_KEY=...
      # - SAMBANOVA_API_KEY=...
      # Replicate:
      # - REPLICATE_API_TOKEN=...
      # Azure OpenAI:
      # - AZURE_OPENAI_API_KEY=...
      # - AZURE_OPENAI_ENDPOINT=...
      # - AZURE_OPENAI_DEPLOYMENT=...
      # - AZURE_OPENAI_API_VERSION=...
      # Azure AI Foundry:
      # - AZURE_FOUNDRY_API_KEY=...
      # - AZURE_FOUNDRY_ENDPOINT=...
      # - AZURE_FOUNDRY_API_VERSION=...
      # AWS Bedrock (use bearer token, instance-role auth with AWS_REGION, or static credentials):
      # - AWS_BEARER_TOKEN_BEDROCK=...
      # - AWS_REGION=us-east-1
      # - AWS_ACCESS_KEY_ID=...
      # - AWS_SECRET_ACCESS_KEY=...
      # - AWS_SESSION_TOKEN=...
      # Google Vertex AI:
      # - VERTEX_AI_PROJECT_ID=...
      # - VERTEX_AI_REGION=us-central1
      # - VERTEX_AI_API_KEY=...
      # - VERTEX_AI_SERVICE_ACCOUNT_JSON=...
      # Hugging Face:
      # - HUGGING_FACE_API_KEY=...
      # Cloudflare Workers AI:
      # - CLOUDFLARE_API_KEY=...
      # - CLOUDFLARE_ACCOUNT_ID=...
      # Databricks:
      # - DATABRICKS_TOKEN=...
      # - DATABRICKS_HOST=https://<workspace>.azuredatabricks.net
      # Ollama (local):
      # - OLLAMA_HOST=http://host.docker.internal:11434
      # - FERRO_OLLAMA_MODELS=llama3,gemma
      #   (OLLAMA_MODELS is still read this release but is deprecated: it is
      #    Ollama's own variable for its models directory)
      # Ollama Cloud:
      # - OLLAMA_API_KEY=...
      # - OLLAMA_CLOUD_MODELS=gpt-oss:20b,gpt-oss:120b
      # - OLLAMA_CLOUD_BASE_URL=https://ollama.com/v1
      # CORS — the built-in dashboard is same-origin and needs no entry here.
      # This is for your own browser apps calling the gateway from elsewhere:
      # - CORS_ORIGINS=https://app.example.com
      # Optional config file. The env var and the mount below are ONE unit —
      # uncomment both or neither. The gateway reads a config file only when
      # GATEWAY_CONFIG names one; a mounted file it was not told about is
      # ignored in silence, and it falls back to key-derived defaults.
      # - GATEWAY_CONFIG=/etc/ferrogw/config.yaml
    # volumes:
    #   - ./config.yaml:/etc/ferrogw/config.yaml:ro
