# Cloudflare Worker serving https://get.ferrolabs.ai — see README.md here.

name = "ferro-get"
main = "worker.js"
compatibility_date = "2026-08-17"

# A whole hostname rather than a path prefix, so this is a Custom Domain: on
# deploy wrangler creates and owns the proxied DNS record itself. That keeps the
# record and the Worker from drifting apart in two different consoles, which is
# the failure mode that leaves a launch link answering 404 with a green deploy.
routes = [
  { pattern = "get.ferrolabs.ai", custom_domain = true }
]

# workers.dev would publish the same installer bytes under a second, unbranded
# hostname. One trust anchor, or the redirect argument in worker.js is moot.
workers_dev = false

[build]
# Inline the installers into the bundle at deploy time. scripts/install/ is the
# single source of truth: it is what shellcheck lints, what the install-matrix
# CI executes, and what a contributor edits — so the Worker reads it rather than
# keeping a second copy that can disagree with it.
#
# Living here rather than in the deploy workflow means `wrangler dev` and
# `wrangler deploy` inline exactly what CI does, from one definition.
#
# A missing or empty script throws, failing the deploy. That is deliberate: the
# alternative is publishing an empty install.sh, which pipes to a shell as a
# silent no-op and reports success to everyone involved.
cwd = "."
watch_dir = "../../scripts/install"
command = '''node -e "const{readFileSync,writeFileSync}=require('node:fs');const read=p=>{const s=readFileSync(p,'utf8');if(!s.trim())throw new Error(p+' is empty');return JSON.stringify(s)};writeFileSync('scripts.generated.js','// Generated by wrangler.toml [build] — do not commit, do not edit. Source: scripts/install/\nexport const installSh = '+read('../../scripts/install/install.sh')+';\nexport const installPs1 = '+read('../../scripts/install/install.ps1')+';\n')"'''
