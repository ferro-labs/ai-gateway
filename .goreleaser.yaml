# GoReleaser configuration for Ferro Labs AI Gateway.
# Docs: https://goreleaser.com
version: 2

before:
  hooks:
    - go mod download
    - go mod verify
    # The dashboard is compiled into the binary with go:embed, and go:embed
    # cannot reference a path outside internal/webui/, so the bundle has to be
    # built and copied into place before the first cross-compile starts.
    # Without this every published binary would answer the dashboard with the
    # built-in placeholder and a 503 — a release that builds clean and has no UI.
    #
    # Hooks are exec'd directly, not through a shell, so these carry no globs
    # or redirection. The sweep spares .gitkeep, the only tracked file there.
    # Requires Node on the runner —
    # see the Set up Node step in .github/workflows/release.yml.
    - npm ci --prefix web
    - npm run build --prefix web
    - find internal/webui/dist -mindepth 1 ! -name .gitkeep -delete
    - cp -R web/dist/. internal/webui/dist/
    # Reproduces every linked dependency's licence into dist/THIRD-PARTY-NOTICES.txt
    # at release time, bundled into the archives (files: below) and the image
    # (/licenses). Generated here rather than committed, so it can never drift
    # from go.mod. Installs go-licenses on demand; needs Go on the runner.
    - ./scripts/gen-licenses.sh

# ─── Builds ──────────────────────────────────────────────────────────────────

builds:
  - id: ferrogw
    binary: ferrogw
    main: ./cmd/ferrogw
    ldflags:
      - -s -w
      - -X github.com/ferro-labs/ai-gateway/internal/version.Version={{.Version}}
      - -X github.com/ferro-labs/ai-gateway/internal/version.Commit={{.ShortCommit}}
      - -X github.com/ferro-labs/ai-gateway/internal/version.Date={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

# ─── Archives ────────────────────────────────────────────────────────────────

archives:
  - id: ferrogw
    ids: [ferrogw]
    name_template: "ferrogw_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - config.example.yaml
      - config.example.json
      # Generated by the before hook; placed at the archive root.
      - src: notices/THIRD-PARTY-NOTICES.txt
        dst: .
        strip_parent: true

# ─── Checksums ───────────────────────────────────────────────────────────────

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# ─── SBOMs ───────────────────────────────────────────────────────────────────
# One SPDX SBOM per archive, generated by syft (must be on PATH — see release.yml).

sboms:
  - id: archives
    artifacts: archive

# ─── Signing ─────────────────────────────────────────────────────────────────
# Keyless cosign signature over the checksum file, which in turn covers every
# archive and SBOM. Uses the workflow's OIDC identity (id-token: write); no
# long-lived keys. --yes suppresses the interactive confirmation in CI.

signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

# ─── Snapshot ────────────────────────────────────────────────────────────────

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# ─── Changelog ───────────────────────────────────────────────────────────────

changelog:
  sort: asc
  use: github
  groups:
    - title: "New Features"
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: "Bug Fixes"
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: "Performance"
      regexp: '^perf(\(.+\))?!?:'
      order: 2
    - title: "Documentation"
      regexp: '^docs(\(.+\))?!?:'
      order: 3
    - title: "Other Changes"
      order: 999
  filters:
    exclude:
      - '^chore(\(.+\))?:'
      - '^ci(\(.+\))?:'
      - '^test(\(.+\))?:'
      - "^Merge pull request"
      - "^Merge branch"

# ─── GitHub Release ──────────────────────────────────────────────────────────

release:
  github:
    owner: ferro-labs
    name: ai-gateway
  draft: false
  prerelease: auto
  mode: replace
  name_template: "v{{ .Version }}"

# ─── Docker images ───────────────────────────────────────────────────────────
# Uses deploy/gateway.release.Dockerfile, which copies the pre-built binary
# instead of building from source, so each platform gets the right binary.
# The path is relative to the project root, not to this file's directory.
#
# One `dockers_v2` block replaces the pair of per-arch `dockers` entries and the
# `docker_manifests` that stitched them together: buildx is given both platforms
# at once and publishes the manifest list itself. Both of those keys are
# deprecated in favour of this one.
#
# `sbom` is the reason the migration happened now. The archives above get an
# SBOM from the `sboms` block, but that block's `artifacts` accepts only
# source|package|archive|binary|any|none — there is no image value — so under
# `dockers` the published images carried no component inventory at all. This
# field is the supported spelling: on publish it adds `--attest=type=sbom` to
# the buildx invocation, so the SBOM is attached to the image in the registry.
#
# The build context is a temporary directory GoReleaser assembles, not the
# repository: cross-compiled binaries land at <goos>/<goarch>/<name> (hence the
# $TARGETPLATFORM in the Dockerfile) and nothing else is present unless it is
# named in extra_files.
#
# Note the per-arch tags are gone: `:{{ .Version }}-amd64` and `:latest-arm64`
# were an artifact of stitching two single-platform builds together. The tags
# people pull — `:{{ .Version }}` and `:latest` — are unchanged and are now
# multi-platform manifests directly. (Snapshot builds still suffix per-arch
# tags locally, because buildx cannot `--load` a manifest list.)

dockers_v2:
  - id: ferrogw
    ids: [ferrogw]
    dockerfile: deploy/gateway.release.Dockerfile
    # The build context is a temp dir, not the repo, so the generated notices
    # have to be named here for the Dockerfile's COPY to find them.
    extra_files:
      - notices/THIRD-PARTY-NOTICES.txt
    images:
      - "ghcr.io/ferro-labs/ai-gateway"
    tags:
      - "{{ .Version }}"
      - "latest"
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: true
    labels:
      org.opencontainers.image.title: "Ferro Labs AI Gateway"
      org.opencontainers.image.description: "Open-source AI Gateway for LLM routing"
      org.opencontainers.image.url: "https://github.com/ferro-labs/ai-gateway"
      org.opencontainers.image.source: "https://github.com/ferro-labs/ai-gateway"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.licenses: "Apache-2.0"

# ─── Docker image signing ────────────────────────────────────────────────────
# Keyless cosign signature over each pushed per-arch image.

docker_signs:
  - cmd: cosign
    args:
      - sign
      - "${artifact}"
      - "--yes"
    artifacts: images
    output: true

# ─── Announce (Go Package Warming) ───────────────────────────────────────────

announce:
  webhook:
    enabled: true
    # Triggers proxy.golang.org to immediately cache the newly created tag
    # so that pkg.go.dev documentation is instantly available.
    endpoint_url: "https://proxy.golang.org/github.com/ferro-labs/ai-gateway/@v/v{{ .Version }}.info"
    skip_tls_verify: false
