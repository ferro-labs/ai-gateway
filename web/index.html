<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    Declared rather than left to the browser's implicit /favicon.ico request.
    The file lives in public/ so it ships at a stable, unhashed path: an icon
    referenced from src/ would be content-hashed on every build, and the
    implicit request would still go to /favicon.ico and 404.
  -->
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
  <!-- Matches the console's own surfaces; this was still the pre-rebuild navy. -->
  <meta name="theme-color" content="#e8edf3" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="Ferro Labs AI Gateway operator dashboard" />
  <title>Ferro AI Gateway</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
